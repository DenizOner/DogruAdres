name: Safe branch lifecycle inventory (NO DELETION)

on:
  workflow_dispatch:
  schedule:
    - cron: '43 8 * * 1'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/branch-lifecycle-inventory.yml'
      - 'quality/automation/branch-lifecycle*.mjs'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: branch-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Read-only guard tests
        run: node --test quality/automation/branch-lifecycle.test.mjs quality/automation/local-worktree-preflight.test.mjs
      - name: Read-only remote branch inventory
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && github.repository == 'DenizOner/DogruAdres' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node quality/automation/branch-lifecycle.mjs
