name: Governance automation and browser tooling

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/governance-automation.yml'
      - 'quality/automation/**'
      - 'quality/e2e/**'
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: governance-automation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Automation tooling self-test (NOT product acceptance)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR merge ref or selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Pure Node status renderer tests
        run: node --test quality/automation/repo-pulse.test.mjs
      - name: Install isolated free Playwright tooling
        run: |
          python3 -m venv /tmp/da-playwright-venv
          /tmp/da-playwright-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir playwright==1.56.0
          /tmp/da-playwright-venv/bin/python -m playwright install --with-deps chromium
      - name: Real Chromium tool check (NOT DogruAdres user test)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          /tmp/da-playwright-venv/bin/python -m unittest discover -s quality/e2e -p 'test_*.py' -v
          echo '### Tooling only — product acceptance NOT TESTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job checks Chromium/Playwright interaction on a synthetic in-memory HTML page. No DoğruAdres API, login, database, authorization or B01–B21 journey is exercised.' >> "$GITHUB_STEP_SUMMARY"

  pulse:
    name: GitHub project pulse (metadata only)
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'DenizOner/DogruAdres' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
    steps:
      - name: Checkout trusted default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Read project status and report only meaningful changes to Issue #245
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULSE_ISSUE_NUMBER: '245'
        run: node quality/automation/repo-pulse.mjs
