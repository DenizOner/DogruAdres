name: TEMP Storefront diagnostic (not acceptance)
on:
  push:
    branches: [fix/next-15-5-27-lockfile-20261020]
permissions:
  contents: read
jobs:
  storefront-diagnostic:
    name: Storefront type lint build diagnostics (NOT ACCEPTANCE)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Install exact lockfile
        run: bun install --frozen-lockfile
      - name: Report actual candidate failure statuses, never claim acceptance
        working-directory: apps/storefront
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_ENV: production
        run: |
          set +e
          timeout 180s node ../../node_modules/typescript/bin/tsc --noEmit --incremental false -p tsconfig.json > /tmp/da-tsc.txt 2>&1
          ts=$?
          timeout 180s bun run lint > /tmp/da-lint.txt 2>&1
          lint=$?
          timeout 360s bun run build > /tmp/da-build.txt 2>&1
          build=$?
          echo "### Storefront candidate diagnostics — NOT AN ACCEPTANCE" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "TypeScript exit=$ts; lint exit=$lint; Next build exit=$build" >> "$GITHUB_STEP_SUMMARY"
          echo "TypeScript exit=$ts; lint exit=$lint; Next build exit=$build"
          for file in /tmp/da-tsc.txt /tmp/da-lint.txt /tmp/da-build.txt; do
            echo "::group::$file"
            sed -n '1,45p' "$file"
            echo '::endgroup::'
          done
          # Intentionally neutral baseline diagnostics; failures remain real failures.
          exit 0
