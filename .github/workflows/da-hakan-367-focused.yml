# Hakan #367: synthetic Admin MFA UI contract only.
# Advisory focused check; not Chrome/HTTPS/PG16, factor reconciliation, or #208 review.
name: DA Hakan 367 — Admin MFA focused Node contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/da-hakan-367-focused.yml'
      - 'apps/admin/src/routes/settings/mfa/page.tsx'
      - 'quality/e2e/hakan-367-mfa-admin-contract.test.mjs'
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: da-hakan-367-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admin-mfa-contract:
    name: Hakan #367 targeted Node source contract (advisory)
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.repository == 'DenizOner/DogruAdres' &&
        github.event.pull_request.number == 452 &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.base.repo.full_name == 'DenizOner/DogruAdres' &&
        github.event.pull_request.head.ref == 'feat/hakan-367-platform-mfa-admin-20261120' &&
        github.event.pull_request.head.repo.full_name == 'DenizOner/DogruAdres'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout PR merge ref, no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Fail closed unless exact PR head and current base were merged
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'pull_request'
          test "$GITHUB_REPOSITORY" = 'DenizOner/DogruAdres'
          test "$PR_NUMBER" = '452'
          # GitHub may retain a historical PR base SHA in the webhook even
          # while its synthetic PR merge ref uses the current live main.
          # Do not trust the stale payload as the live branch. Read the
          # current public protected main ref independently; fail if it drifts.
          git -c credential.helper= fetch --no-tags --depth=1 origin refs/heads/main
          LIVE_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          test "$(git rev-parse HEAD^1)" = "$LIVE_MAIN_SHA"
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"
          test "$(git show -s --format=%P HEAD | wc -w | tr -d ' ')" = '2'
          if [ "$PR_BASE_SHA" != "$LIVE_MAIN_SHA" ]; then
            echo 'PR event stored-base SHA differs from protected live main; synthetic merge is verified against live main.'
          fi
          test -f apps/admin/src/routes/settings/mfa/page.tsx
          test -f quality/e2e/hakan-367-mfa-admin-contract.test.mjs
          echo "PASS: GitHub PR #452 exact head and live-main synthetic merge parents verified"
          echo "Scope: synthetic parser/source contract only; real browser/API/PG16 NOT TESTED"

      - name: Setup pinned Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Setup pinned Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true

      - name: Install root lockfile without modifying tracked sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.22.1'
          test "$(bun --version)" = '1.4.2'
          bun install --frozen-lockfile

      - name: RUN exact Hakan #367 Admin MFA Node tests
        shell: bash
        run: |
          set -euo pipefail
          node --test quality/e2e/hakan-367-mfa-admin-contract.test.mjs

      - name: State advisory acceptance boundary
        if: success()
        run: |
          echo 'Target Node source/response contract executed; not a full MFA security acceptance.'
          echo 'Chrome/HTTPS/PG16, native factor transitions, audit, integration and independent #208 review remain separate.'
