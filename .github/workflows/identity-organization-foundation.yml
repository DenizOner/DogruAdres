name: Identity Organization Foundation

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Authorized isolated acceptance scope
        required: true
        type: choice
        options: [b02, b04, b04-ui, b05-ui, b06-ui, b07-ui, b08-ui]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  r1-windows-authz:
    if: github.event_name != 'workflow_dispatch'
    name: R1 Windows native Authz — synthetic token/ACL only
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - name: Checkout exact PR merge ref without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and execute native Windows Authz against in-memory descriptors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Path 'packages/api/src/scripts/r1-authz.cs'
          $me = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $allow = [System.Security.AccessControl.FileSecurity]::new()
          $allow.SetOwner($me.User)
          $allow.SetAccessRuleProtection($true, $false)
          $allow.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new($me.User, [System.Security.AccessControl.FileSystemRights]::ReadData, [System.Security.AccessControl.AccessControlType]::Allow))
          $sd = $allow.GetSecurityDescriptorBinaryForm()
          $mask = [R1AclProbe]::Check($sd, '')
          if (($mask -band 1) -ne 1) { throw 'FAIL: native current-token read not granted' }
          $deny = [System.Security.AccessControl.FileSecurity]::new()
          $deny.SetOwner($me.User)
          $deny.SetAccessRuleProtection($true, $false)
          $deny.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new($me.User, [System.Security.AccessControl.FileSystemRights]::ReadData, [System.Security.AccessControl.AccessControlType]::Deny))
          $denied = [R1AclProbe]::Check($deny.GetSecurityDescriptorBinaryForm(), '')
          if (($denied -band 1) -ne 0) { throw 'FAIL: native denied read granted' }
          # PowerShell may wrap a native C# exception in multiple layers.
          function Assert-ExpectedRefusal([System.Exception]$errorValue, [string]$label) {
            $cursor = $errorValue
            while ($null -ne $cursor) {
              if ($cursor.Message -like 'BLOCKED:*' -or $cursor.Message -like 'REFUSED:*') { return }
              $cursor = $cursor.InnerException
            }
            throw "FAIL: unexpected exception for $label"
          }
          try {
            [void][R1AclProbe]::Check($sd, $me.User.Value)
            throw 'FAIL: uncommissioned SID route accepted'
          } catch {
            Assert-ExpectedRefusal $_.Exception 'uncommissioned SID'
          }
          $method = [R1AclProbe].GetMethod('CheckVerifiedReaderProcess', [System.Reflection.BindingFlags]::Static -bor [System.Reflection.BindingFlags]::NonPublic)
          if ($null -eq $method) { throw 'FAIL: actual-token process probe missing' }
          $proc = [System.Diagnostics.Process]::GetCurrentProcess()
          $args = [object[]]::new(5)
          $args[0] = $sd
          $args[1] = [int]$proc.Id
          $args[2] = [string]$proc.StartTime.ToUniversalTime().ToFileTimeUtc()
          $args[3] = [string]$me.User.Value
          $args[4] = [string]$proc.MainModule.FileName
          $actual = [uint32]$method.Invoke($null, $args)
          if (($actual -band 1) -ne 1) { throw 'FAIL: verified real-process token denied synthetic read' }
          function Assert-Refused([object[]]$values, [string]$label) {
            try {
              [void]$method.Invoke($null, $values)
              throw "FAIL: $label accepted"
            } catch {
              Assert-ExpectedRefusal $_.Exception $label
            }
          }
          $bad = [object[]]$args.Clone()
          $bad[2] = [string](([long]$args[2]) + 1)
          Assert-Refused $bad 'wrong creation time'
          $bad = [object[]]$args.Clone()
          $bad[3] = 'S-1-0-0'
          Assert-Refused $bad 'wrong process SID'
          $bad = [object[]]$args.Clone()
          $bad[4] = [string](Join-Path $env:WINDIR 'System32\cmd.exe')
          Assert-Refused $bad 'wrong executable'
          $bad = [object[]]$args.Clone()
          $bad[1] = -1
          Assert-Refused $bad 'invalid process ID'
          Write-Output 'PASS: real Windows Authz in-memory allow/deny, private process token and rejected substitutions; protected sandbox NOT TESTED'

  static:
    if: github.event_name != 'workflow_dispatch'
    name: Foundation static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record source provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          echo "PR head: $PR_HEAD_SHA"
          echo "Merge ref: $MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Native SMTP HTTPS privacy negative regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: |
          node --test integration-tests/postgres/smtp-response-privacy-guard.test.mjs
          bun test integration-tests/postgres/smtp-response-privacy-guard.test.mjs
      - name: Focused security and authorization unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: bun test src/modules/dogruadres-access/__tests__/security.unit.spec.ts src/utils/__tests__/organization-authorization.unit.spec.ts src/scripts/__tests__/task-mfa-bootstrap.unit.spec.ts src/scripts/__tests__/reviewer-execution-grant.unit.spec.ts src/scripts/__tests__/native-fixture-runtime.unit.spec.ts src/scripts/__tests__/r1-readiness.unit.spec.ts src/scripts/__tests__/r1-readback.unit.spec.ts src/scripts/__tests__/r1-activation.unit.spec.ts
      - name: Production HTTP secret guard regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: bun test src/utils/__tests__/production-secrets.unit.test.ts
      - name: Inactive session policy and DTO unit contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: bun test src/modules/dogruadres-access/__tests__/session-policy.unit.spec.ts src/api/dogruadres/__tests__/session-policy-contract.unit.spec.ts
      - name: API TypeScript check
        # Runtime/PostgreSQL/browser evidence is collected separately; this is unit-only.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        # Keep every TypeScript diagnostic active. This project-wide Medusa
        # typecheck exceeds Node's default V8 call stack (RangeError) on
        # current B22 source; provide bounded stack headroom, not --skipCheck.
        run: node --stack-size=4096 ../../node_modules/typescript/bin/tsc --noEmit --incremental false -p tsconfig.json
      - name: Admin dashboard TypeScript and Vite build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/admin
        run: |
          bun run build
          test -s dist/index.html
          grep -Fq '/dashboard/assets/' dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -print -quit)"
      - name: Token privacy and native SMTP notification regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        env:
          TEST_TYPE: unit
        run: bun run jest --runInBand --runTestsByPath src/subscribers/__tests__/auth-verification-requested.unit.spec.ts src/modules/notification-smtp/__tests__/notification-smtp.unit.spec.ts src/modules/notification-smtp/__tests__/notification-transport.unit.spec.ts src/modules/notification-smtp/__tests__/verification-origin.unit.spec.ts src/api/personal/__tests__/token-privacy.unit.spec.ts src/api/auth/__tests__/verify-email.unit.spec.ts
      - name: Personal session, Organization selection and ingress unit contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        env:
          TEST_TYPE: unit
        run: bun run jest --runInBand --forceExit --runTestsByPath src/modules/dogruadres-access/__tests__/identity-session.unit.spec.ts src/modules/dogruadres-access/__tests__/person-mobile.unit.spec.ts src/modules/dogruadres-access/__tests__/person-registration.unit.spec.ts src/modules/dogruadres-access/__tests__/legal-store-ownership.unit.spec.ts src/modules/dogruadres-access/__tests__/memberships-service.unit.spec.ts src/modules/dogruadres-access/__tests__/invitation-resend-service.unit.spec.ts src/modules/dogruadres-access/__tests__/actor-delegation.unit.spec.ts src/modules/dogruadres-access/__tests__/account-linking.unit.spec.ts src/utils/__tests__/ingress-config.unit.spec.ts src/api/personal/__tests__/ingress.unit.spec.ts src/api/personal/__tests__/profile.unit.spec.ts src/api/personal/__tests__/register.unit.spec.ts src/api/personal/__tests__/organization-applications.unit.spec.ts src/modules/dogruadres-access/__tests__/tax-certificate-policy.unit.spec.ts src/modules/dogruadres-access/__tests__/tax-certificate-scanner.unit.spec.ts src/api/personal/__tests__/organization-selection.unit.spec.ts src/api/personal/__tests__/organization-stores.unit.spec.ts src/api/personal/__tests__/store-approvals.unit.spec.ts src/api/personal/__tests__/store-product-permissions.unit.spec.ts src/api/personal/__tests__/store-member-connections.unit.spec.ts src/api/personal/__tests__/buyer-permissions.unit.spec.ts src/api/personal/__tests__/buyer-context.unit.spec.ts src/api/personal/__tests__/catalog.unit.spec.ts src/api/personal/__tests__/native-try-list-price.unit.spec.ts src/api/personal/__tests__/native-group-try-reference.unit.spec.ts src/api/personal/__tests__/store-price-groups.unit.spec.ts src/api/personal/__tests__/product-drafts.unit.spec.ts src/api/personal/__tests__/launcher-b22.unit.spec.ts src/api/personal/__tests__/workspace-lifetime.unit.spec.ts src/api/personal/__tests__/notifications.unit.spec.ts src/api/personal/__tests__/memberships.unit.spec.ts src/api/personal/__tests__/invitations.unit.spec.ts src/api/dogruadres/__tests__/audit-timeline.unit.spec.ts src/api/personal/__tests__/audit-timeline.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-policy.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-login-decision.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-persistence.unit.spec.ts src/modules/dogruadres-access/__tests__/audit-persistence.unit.spec.ts src/modules/dogruadres-audit-index/__tests__/envelope.unit.spec.ts src/workflows/dogruadres-audit-relay/__tests__/relay.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-settings-service.unit.spec.ts src/modules/dogruadres-access/__tests__/native-mfa-summary.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-enrollment-ticket.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-session-scope.unit.spec.ts src/api/personal/__tests__/mfa-settings.unit.spec.ts src/api/personal/__tests__/mfa-management.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-management.unit.spec.ts src/api/personal/__tests__/mfa-shell.unit.spec.ts src/api/personal/__tests__/mfa-enrollment.unit.spec.ts src/api/personal/__tests__/mfa-login-runtime.unit.spec.ts src/api/personal/__tests__/mfa-challenge-recovery.unit.spec.ts src/modules/dogruadres-access/__tests__/provision-personal-organization.unit.spec.ts src/api/personal/__tests__/platform.unit.spec.ts src/modules/dogruadres-access/__tests__/smtp-client.unit.spec.ts src/api/personal/__tests__/platform-smtp.unit.spec.ts src/modules/dogruadres-access/__tests__/smtp-settings.unit.spec.ts src/modules/dogruadres-access/__tests__/smtp-crypto.unit.spec.ts
      - name: Closed public front door unit contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: node --test integration-tests/session-vertical/frontdoor.unit.test.mjs
      - name: Native HTTP test syntax only
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: node --check integration-tests/http/dogruadres-foundation.native.test.mjs

  build:
    if: github.event_name != 'workflow_dispatch'
    name: API backend build — test configuration
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record source provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          echo "PR head: $PR_HEAD_SHA"
          echo "Merge ref: $MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build API backend under test configuration
        working-directory: packages/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://ci@127.0.0.1:1/dogruadres_ci_build_sentinel
          REDIS_URL: redis://127.0.0.1:1
          STORE_CORS: http://127.0.0.1:19040
          ADMIN_CORS: http://127.0.0.1:19040
          VENDOR_CORS: http://127.0.0.1:19040
          AUTH_CORS: http://127.0.0.1:19040
        run: |
          # Build only: no API, migrations, services or production dashboard claim.
          export JWT_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          export COOKIE_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          export DOGRUADRES_INVITATION_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          bun run build
      - name: Production Medusa CLI rejects scaffold JWT and cookie secrets (no database)
        working-directory: packages/api
        timeout-minutes: 4
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://ci@127.0.0.1:1/safe0a_build_sentinel
          REDIS_URL: redis://127.0.0.1:1
          STORE_CORS: http://127.0.0.1:19040
          ADMIN_CORS: http://127.0.0.1:19040
          VENDOR_CORS: http://127.0.0.1:19040
          AUTH_CORS: http://127.0.0.1:19040
        shell: bash
        run: |
          set +e
          output=$(JWT_SECRET=supersecret COOKIE_SECRET=supersecret timeout 120s bunx medusa build 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "UNSAFE: Medusa production build accepted scaffold auth secrets"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -q 'Production requires distinct'; then
            echo "FAIL: Medusa CLI did not reject secrets through the expected validator"
            exit 1
          fi
          echo "PASS: production Medusa CLI rejected scaffold secrets before server startup"
      - name: Production Medusa build accepts unique synthetic secrets (no database)
        working-directory: packages/api
        timeout-minutes: 10
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://ci@127.0.0.1:1/safe0a_build_sentinel
          REDIS_URL: redis://127.0.0.1:1
          STORE_CORS: http://127.0.0.1:19040
          ADMIN_CORS: http://127.0.0.1:19040
          VENDOR_CORS: http://127.0.0.1:19040
          AUTH_CORS: http://127.0.0.1:19040
          FILE_BACKEND_URL: http://127.0.0.1:19040/static
        shell: bash
        run: |
          export JWT_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          export COOKIE_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          export DOGRUADRES_INVITATION_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          # Compile only: never launch a server, create a database, migrate or deploy.
          timeout 420s bunx medusa build

  mfa-postgres16:
    name: MFA migration and transaction — isolated PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: mfa_test
          POSTGRES_PASSWORD: ci-disposable-only-not-a-real-secret
          POSTGRES_DB: mfa_ci_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mfa_test -d mfa_ci_ephemeral"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Isolated official Redis alternative; no production/provider change.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout exact PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Exercise MFA transactions and real migration ledger on same disposable PG16
        if: github.event_name != 'workflow_dispatch'
        working-directory: packages/api
        env:
          CI: 'true'
          PG_MFA_TEST_SENTINEL: mfa-pg16-disposable-ci-v1
          PG_MFA_TEST_URL: postgres://mfa_test:ci-disposable-only-not-a-real-secret@127.0.0.1:5432/mfa_ci_ephemeral
        run: |
          bun integration-tests/postgres/mfa-persistence.pg16.test.ts
          bun integration-tests/postgres/mfa-migrator-ledger.pg16.test.ts
          bun integration-tests/postgres/foundation-membership-transaction.pg16.test.ts
      - name: Existing Chrome task CA support for B22 scoped browser acceptance
        if: github.event_name != 'workflow_dispatch'
        run: |
          if ! command -v certutil >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y libnss3-tools
          fi
          command -v openssl
          command -v certutil
          command -v google-chrome
      - name: B22 free ClamAV signature database and isolated renderer — task-only PR
        if: github.event_name != 'workflow_dispatch' && github.head_ref == 'feature/b22-tax-certificate-admission-20261105'
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          # These packages are free and confined to this disposable CI runner.
          # A blocked signature download or unavailable sandbox MUST fail;
          # never downgrade the document review to header/magic-byte checks.
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            clamav-daemon clamav-freshclam bubblewrap poppler-utils imagemagick \
            apparmor-profiles apparmor-utils acl
          # Ubuntu 24.04 blocks unprivileged bwrap namespaces by default.
          # Load ONLY its distribution-supplied restrictive bwrap profile in
          # this throwaway CI VM. Never disable global AppArmor or userns rules.
          test -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = "1"
          sudo systemctl stop clamav-freshclam.service >/dev/null 2>&1 || true
          # This CI task starts its own private clamd AFTER the official
          # signatures are installed. Suppress only FreshClam's notification
          # to the unrelated distro daemon, not database verification.
          # FreshClam switches to the restricted clamav account; its
          # configuration must stay readable after privilege drop. This
          # modifies only this disposable CI runner, never a host install.
          sudo sed -i '/^NotifyClamd[[:space:]]/d' /etc/clamav/freshclam.conf
          sudo freshclam --config-file=/etc/clamav/freshclam.conf --stdout
          test -s /var/lib/clamav/daily.cvd || test -s /var/lib/clamav/daily.cld
          test -s /var/lib/clamav/main.cvd || test -s /var/lib/clamav/main.cld
          echo "PASS B22: genuine updated ClamAV database installed"

          # Probe unprivileged namespaces. Never change host sysctl, AppArmor,
          # service privileges or Docker access to force a test to pass.
          /usr/bin/bwrap --unshare-all --new-session --ro-bind /usr /usr \
            --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 \
            --proc /proc --dev /dev --tmpfs /tmp -- /usr/bin/true
          echo "PASS B22: Ubuntu restricted Bubblewrap namespace with no network"

          # The Ubuntu package already provides an AppArmor-confined daemon
          # and its local Unix socket. Do not invent a second daemon/socket:
          # /usr/sbin/clamd is forbidden from binding under RUNNER_TEMP.
          conf=/etc/clamav/clamd.conf
          test -r "$conf"
          # This distro daemon disables VERSION. Keep ClamAV signature-age
          # verification mandatory; enable only local metadata on disposable CI.
          if grep -Eq '^[[:space:]]*EnableVersionCommand[[:space:]]+no([[:space:]]*)$' "$conf"; then
            sudo sed -i -E 's/^[[:space:]]*EnableVersionCommand[[:space:]]+no([[:space:]]*)$/EnableVersionCommand yes/' "$conf"
          elif ! grep -Eq '^[[:space:]]*EnableVersionCommand[[:space:]]+yes([[:space:]]*)$' "$conf"; then
            echo 'EnableVersionCommand yes' | sudo tee -a "$conf" >/dev/null
          fi
          grep -Eq '^[[:space:]]*EnableVersionCommand[[:space:]]+yes([[:space:]]*)$' "$conf"
          sock=$(awk '$1=="LocalSocket" {print $2}' "$conf" | head -n1)
          case "$sock" in
            /run/clamav/clamd.ctl|/var/run/clamav/clamd.ctl) ;;
            *) echo "REFUSED: unexpected ClamAV socket"; exit 1;;
          esac
          if grep -Eq '^[[:space:]]*TCPSocket[[:space:]]+[0-9]+' "$conf"; then
            echo "REFUSED: ClamAV must have no TCP listener"
            exit 1
          fi
          sudo systemctl restart clamav-daemon.socket clamav-daemon.service
          for attempt in {1..100}; do
            if [ -S "$sock" ] && sudo systemctl is-active --quiet clamav-daemon.service; then break; fi
            sleep 1
          done
          if [ ! -S "$sock" ] || ! sudo systemctl is-active --quiet clamav-daemon.service; then
