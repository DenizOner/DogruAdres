name: Identity Organization Foundation

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Authorized isolated acceptance scope
        required: true
        type: choice
        options: [b02, b04, b04-ui, b05-ui, b06-ui, b07-ui, b08-ui]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    if: github.event_name != 'workflow_dispatch'
    name: Foundation static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record source provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          echo "PR head: $PR_HEAD_SHA"
          echo "Merge ref: $MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Focused security and authorization unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: bun test src/modules/dogruadres-access/__tests__/security.unit.spec.ts src/utils/__tests__/organization-authorization.unit.spec.ts src/scripts/__tests__/task-mfa-bootstrap.unit.spec.ts src/scripts/__tests__/reviewer-execution-grant.unit.spec.ts src/scripts/__tests__/native-fixture-runtime.unit.spec.ts src/scripts/__tests__/r1-readiness.unit.spec.ts src/scripts/__tests__/r1-readback.unit.spec.ts src/scripts/__tests__/r1-activation.unit.spec.ts
      - name: Production HTTP secret guard regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: bun test src/utils/__tests__/production-secrets.unit.test.ts
      - name: Inactive session policy and DTO unit contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: bun test src/modules/dogruadres-access/__tests__/session-policy.unit.spec.ts src/api/dogruadres/__tests__/session-policy-contract.unit.spec.ts
      - name: API TypeScript check
        # Runtime/PostgreSQL/browser evidence is collected separately; this is unit-only.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: node ../../node_modules/typescript/bin/tsc --noEmit --incremental false -p tsconfig.json
      - name: Token privacy and native SMTP notification regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        env:
          TEST_TYPE: unit
        run: bun run jest --runInBand --runTestsByPath src/subscribers/__tests__/auth-verification-requested.unit.spec.ts src/modules/notification-smtp/__tests__/notification-smtp.unit.spec.ts src/modules/notification-smtp/__tests__/notification-transport.unit.spec.ts src/modules/notification-smtp/__tests__/verification-origin.unit.spec.ts src/api/personal/__tests__/token-privacy.unit.spec.ts
      - name: Personal session, Organization selection and ingress unit contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        env:
          TEST_TYPE: unit
        run: bun run jest --runInBand --forceExit --runTestsByPath src/modules/dogruadres-access/__tests__/identity-session.unit.spec.ts src/modules/dogruadres-access/__tests__/legal-store-ownership.unit.spec.ts src/modules/dogruadres-access/__tests__/memberships-service.unit.spec.ts src/modules/dogruadres-access/__tests__/actor-delegation.unit.spec.ts src/modules/dogruadres-access/__tests__/account-linking.unit.spec.ts src/utils/__tests__/ingress-config.unit.spec.ts src/api/personal/__tests__/ingress.unit.spec.ts src/api/personal/__tests__/organization-selection.unit.spec.ts src/api/personal/__tests__/organization-stores.unit.spec.ts src/api/personal/__tests__/launcher-b22.unit.spec.ts src/api/personal/__tests__/workspace-lifetime.unit.spec.ts src/api/personal/__tests__/notifications.unit.spec.ts src/api/personal/__tests__/memberships.unit.spec.ts src/api/personal/__tests__/invitations.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-policy.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-login-decision.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-persistence.unit.spec.ts src/modules/dogruadres-access/__tests__/audit-persistence.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-settings-service.unit.spec.ts src/modules/dogruadres-access/__tests__/native-mfa-summary.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-enrollment-ticket.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-session-scope.unit.spec.ts src/api/personal/__tests__/mfa-settings.unit.spec.ts src/api/personal/__tests__/mfa-management.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-management.unit.spec.ts src/api/personal/__tests__/mfa-shell.unit.spec.ts src/api/personal/__tests__/mfa-enrollment.unit.spec.ts src/api/personal/__tests__/mfa-login-runtime.unit.spec.ts src/api/personal/__tests__/mfa-challenge-recovery.unit.spec.ts src/modules/dogruadres-access/__tests__/provision-personal-organization.unit.spec.ts src/api/personal/__tests__/platform.unit.spec.ts src/modules/dogruadres-access/__tests__/smtp-client.unit.spec.ts
      - name: Closed public front door unit contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: node --test integration-tests/session-vertical/frontdoor.unit.test.mjs
      - name: Native HTTP test syntax only
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: node --check integration-tests/http/dogruadres-foundation.native.test.mjs

  build:
    if: github.event_name != 'workflow_dispatch'
    name: API backend build — test configuration
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record source provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          echo "PR head: $PR_HEAD_SHA"
          echo "Merge ref: $MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build API backend under test configuration
        working-directory: packages/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://ci@127.0.0.1:1/dogruadres_ci_build_sentinel
          REDIS_URL: redis://127.0.0.1:1
          STORE_CORS: http://127.0.0.1:19040
          ADMIN_CORS: http://127.0.0.1:19040
          VENDOR_CORS: http://127.0.0.1:19040
          AUTH_CORS: http://127.0.0.1:19040
        run: |
          # Build only: no API, migrations, services or production dashboard claim.
          export JWT_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          export COOKIE_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          export DOGRUADRES_INVITATION_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          bun run build
      - name: Production Medusa CLI rejects scaffold JWT and cookie secrets (no database)
        working-directory: packages/api
        timeout-minutes: 4
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://ci@127.0.0.1:1/safe0a_build_sentinel
          REDIS_URL: redis://127.0.0.1:1
          STORE_CORS: http://127.0.0.1:19040
          ADMIN_CORS: http://127.0.0.1:19040
          VENDOR_CORS: http://127.0.0.1:19040
          AUTH_CORS: http://127.0.0.1:19040
        shell: bash
        run: |
          set +e
          output=$(JWT_SECRET=supersecret COOKIE_SECRET=supersecret timeout 120s bunx medusa build 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "UNSAFE: Medusa production build accepted scaffold auth secrets"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -q 'Production requires distinct'; then
            echo "FAIL: Medusa CLI did not reject secrets through the expected validator"
            exit 1
          fi
          echo "PASS: production Medusa CLI rejected scaffold secrets before server startup"
      - name: Production Medusa build accepts unique synthetic secrets (no database)
        working-directory: packages/api
        timeout-minutes: 10
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://ci@127.0.0.1:1/safe0a_build_sentinel
          REDIS_URL: redis://127.0.0.1:1
          STORE_CORS: http://127.0.0.1:19040
          ADMIN_CORS: http://127.0.0.1:19040
          VENDOR_CORS: http://127.0.0.1:19040
          AUTH_CORS: http://127.0.0.1:19040
          FILE_BACKEND_URL: http://127.0.0.1:19040/static
        shell: bash
        run: |
          export JWT_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          export COOKIE_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          export DOGRUADRES_INVITATION_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          # Compile only: never launch a server, create a database, migrate or deploy.
          timeout 420s bunx medusa build

  mfa-postgres16:
    name: MFA migration and transaction — isolated PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: mfa_test
          POSTGRES_PASSWORD: ci-disposable-only-not-a-real-secret
          POSTGRES_DB: mfa_ci_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mfa_test -d mfa_ci_ephemeral"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout exact PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Exercise MFA transactions and real migration ledger on same disposable PG16
        if: github.event_name != 'workflow_dispatch'
        working-directory: packages/api
        env:
          CI: 'true'
          PG_MFA_TEST_SENTINEL: mfa-pg16-disposable-ci-v1
          PG_MFA_TEST_URL: postgres://mfa_test:ci-disposable-only-not-a-real-secret@127.0.0.1:5432/mfa_ci_ephemeral
        run: |
          bun integration-tests/postgres/mfa-persistence.pg16.test.ts
          bun integration-tests/postgres/mfa-migrator-ledger.pg16.test.ts
          bun integration-tests/postgres/foundation-membership-transaction.pg16.test.ts
      - name: Full Medusa CLI module migration on disposable PG16
        if: github.event_name != 'workflow_dispatch'
        working-directory: packages/api
        timeout-minutes: 7
        env:
          CI: 'true'
          PG_MFA_TEST_SENTINEL: mfa-pg16-disposable-ci-v1
          PG_MFA_TEST_URL: postgres://mfa_test:ci-disposable-only-not-a-real-secret@127.0.0.1:5432/mfa_ci_ephemeral
          PG_MFA_TEST_SCOPE: verification
        run: bun integration-tests/postgres/foundation-medusa-cli.pg16.test.ts
      - name: B02-only native HTTP and SQL negatives
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'b02'
        working-directory: packages/api
        timeout-minutes: 7
        env:
          CI: 'true'
          PG_MFA_TEST_SENTINEL: mfa-pg16-disposable-ci-v1
          PG_MFA_TEST_URL: postgres://mfa_test:ci-disposable-only-not-a-real-secret@127.0.0.1:5432/mfa_ci_ephemeral
          PG_MFA_TEST_SCOPE: b02
        run: |
          set -o pipefail
          bun integration-tests/postgres/foundation-medusa-cli.pg16.test.ts | tee "$RUNNER_TEMP/b02-evidence.log"
      - name: Preserve sanitized B02 execution evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.scope == 'b02'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b02-native-http-sql
          path: ${{ runner.temp }}/b02-evidence.log
          if-no-files-found: error
      - name: B04-only native HTTP and SQL acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'b04'
        working-directory: packages/api
        timeout-minutes: 7
        env:
          CI: 'true'
          PG_MFA_TEST_SENTINEL: mfa-pg16-disposable-ci-v1
          PG_MFA_TEST_URL: postgres://mfa_test:ci-disposable-only-not-a-real-secret@127.0.0.1:5432/mfa_ci_ephemeral
          PG_MFA_TEST_SCOPE: b04
        run: |
          set -o pipefail
          bun integration-tests/postgres/foundation-medusa-cli.pg16.test.ts | tee "$RUNNER_TEMP/b04-evidence.log"
      - name: Preserve sanitized B04 execution evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.scope == 'b04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b04-native-http-sql
          path: ${{ runner.temp }}/b04-evidence.log
          if-no-files-found: error
      - name: B04-UI-only real Chrome and native HTTP/SQL acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'b04-ui'
        working-directory: packages/api
        timeout-minutes: 9
        env:
          CI: 'true'
          PG_MFA_TEST_SENTINEL: mfa-pg16-disposable-ci-v1
          PG_MFA_TEST_URL: postgres://mfa_test:ci-disposable-only-not-a-real-secret@127.0.0.1:5432/mfa_ci_ephemeral
          PG_MFA_TEST_SCOPE: b04-ui
          B04_UI_DISPATCH_SCOPE: b04-ui
        run: |
          set -o pipefail
          echo "B04-UI source HEAD=$(git rev-parse HEAD) event=$GITHUB_EVENT_NAME scope=$B04_UI_DISPATCH_SCOPE"
          bun integration-tests/postgres/foundation-medusa-cli.pg16.test.ts | tee "$RUNNER_TEMP/b04-ui-evidence.log"
      - name: Preserve sanitized B04-UI execution evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.scope == 'b04-ui'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b04-ui-chrome-http-sql
          path: ${{ runner.temp }}/b04-ui-evidence.log
          if-no-files-found: error
      - name: B05-UI-only membership listing in real Chrome and native HTTP/SQL
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'b05-ui'
        working-directory: packages/api
        timeout-minutes: 10
        env:
          CI: 'true'
          PG_MFA_TEST_SENTINEL: mfa-pg16-disposable-ci-v1
          PG_MFA_TEST_URL: postgres://mfa_test:ci-disposable-only-not-a-real-secret@127.0.0.1:5432/mfa_ci_ephemeral
          PG_MFA_TEST_SCOPE: b05-ui
          B05_UI_DISPATCH_SCOPE: b05-ui
        run: |
          set -o pipefail
          echo "B05-UI source HEAD=$(git rev-parse HEAD) event=$GITHUB_EVENT_NAME scope=$B05_UI_DISPATCH_SCOPE"
          bun integration-tests/postgres/foundation-medusa-cli.pg16.test.ts | tee "$RUNNER_TEMP/b05-ui-evidence.log"
      - name: Preserve sanitized B05-UI execution evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.scope == 'b05-ui'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b05-ui-chrome-http-sql
          path: ${{ runner.temp }}/b05-ui-evidence.log
          if-no-files-found: error
      - name: B06-only role acceptance prerequisites
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'b06-ui'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libnss3-tools
          command -v openssl
          command -v certutil
          command -v google-chrome
      - name: B06-only real Chrome native MFA and role HTTP/SQL
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'b06-ui'
        working-directory: packages/api
        timeout-minutes: 14
        env:
          CI: 'true'
          PG_MFA_TEST_SENTINEL: mfa-pg16-disposable-ci-v1
          PG_MFA_TEST_URL: postgres://mfa_test:ci-disposable-only-not-a-real-secret@127.0.0.1:5432/mfa_ci_ephemeral
          PG_MFA_TEST_SCOPE: b06-ui
          B06_UI_DISPATCH_SCOPE: b06-ui
          B06_EVIDENCE_DIR: ${{ runner.temp }}/b06-ui-evidence
        run: |
          set -o pipefail
          echo "B06-UI source HEAD=$(git rev-parse HEAD) event=$GITHUB_EVENT_NAME scope=$B06_UI_DISPATCH_SCOPE"
          bun integration-tests/postgres/foundation-medusa-cli.pg16.test.ts | tee "$RUNNER_TEMP/b06-ui-evidence.log"
      - name: Preserve sanitized B06-only acceptance evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.scope == 'b06-ui'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b06-ui-chrome-mfa-http-sql
          path: |
            ${{ runner.temp }}/b06-ui-evidence.log
            ${{ runner.temp }}/b06-ui-evidence/
          if-no-files-found: error
      - name: B07-only role acceptance prerequisites
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'b07-ui'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libnss3-tools
          command -v openssl
          command -v certutil
          command -v google-chrome
      - name: B07-only real Chrome native MFA and role HTTP/SQL
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'b07-ui'
        working-directory: packages/api
        timeout-minutes: 14
        env:
          CI: 'true'
          PG_MFA_TEST_SENTINEL: mfa-pg16-disposable-ci-v1
          PG_MFA_TEST_URL: postgres://mfa_test:ci-disposable-only-not-a-real-secret@127.0.0.1:5432/mfa_ci_ephemeral
          PG_MFA_TEST_SCOPE: b07-ui
          B07_UI_DISPATCH_SCOPE: b07-ui
          B07_EVIDENCE_DIR: ${{ runner.temp }}/b07-ui-evidence
        run: |
          set -o pipefail
          echo "B07-UI source HEAD=$(git rev-parse HEAD) event=$GITHUB_EVENT_NAME scope=$B07_UI_DISPATCH_SCOPE"
          bun integration-tests/postgres/foundation-medusa-cli.pg16.test.ts | tee "$RUNNER_TEMP/b07-ui-evidence.log"
      - name: Preserve sanitized B07-only acceptance evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.scope == 'b07-ui'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b07-ui-chrome-mfa-http-sql
          path: |
            ${{ runner.temp }}/b07-ui-evidence.log
            ${{ runner.temp }}/b07-ui-evidence/
          if-no-files-found: error
      - name: B08-only role acceptance prerequisites
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'b08-ui'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libnss3-tools
          command -v openssl
          command -v certutil
          command -v google-chrome
      - name: B08-only real Chrome native MFA and role HTTP/SQL
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'b08-ui'
        working-directory: packages/api
        timeout-minutes: 14
        env:
          CI: 'true'
          PG_MFA_TEST_SENTINEL: mfa-pg16-disposable-ci-v1
          PG_MFA_TEST_URL: postgres://mfa_test:ci-disposable-only-not-a-real-secret@127.0.0.1:5432/mfa_ci_ephemeral
          PG_MFA_TEST_SCOPE: b08-ui
          B08_UI_DISPATCH_SCOPE: b08-ui
          B08_EVIDENCE_DIR: ${{ runner.temp }}/b08-ui-evidence
        run: |
          set -o pipefail
          echo "B08-UI source HEAD=$(git rev-parse HEAD) event=$GITHUB_EVENT_NAME scope=$B08_UI_DISPATCH_SCOPE"
          bun integration-tests/postgres/foundation-medusa-cli.pg16.test.ts | tee "$RUNNER_TEMP/b08-ui-evidence.log"
      - name: Preserve sanitized B08-only acceptance evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.scope == 'b08-ui'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b08-ui-chrome-mfa-http-sql
          path: |
            ${{ runner.temp }}/b08-ui-evidence.log
            ${{ runner.temp }}/b08-ui-evidence/
          if-no-files-found: error
      - name: Foundation native Medusa module / ORM transaction on disposable PG16
        if: github.event_name != 'workflow_dispatch'
        working-directory: packages/api
        env:
          CI: 'true'
          PG_MFA_TEST_SENTINEL: mfa-pg16-disposable-ci-v1
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USERNAME: mfa_test
          DB_PASSWORD: ci-disposable-only-not-a-real-secret
          TEST_TYPE: integration:modules
        run: bun run test:integration:modules --runTestsByPath src/modules/dogruadres-access/__tests__/foundation-native.integration.spec.ts
      # The test erases its own schema in finally. GitHub Actions terminates and
      # removes this ephemeral PostgreSQL service on job exit/cancel. There is
      # no repository volume, persistent fixture or access to the M0 task DB.
