  mfa-postgres16:
    # Keep explicitly requested isolated dispatch runs available for drafts.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: MFA migration and transaction — isolated PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: mfa_test
          POSTGRES_PASSWORD: ci-disposable-only-not-a-real-secret
          POSTGRES_DB: mfa_ci_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mfa_test -d mfa_ci_ephemeral"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Isolated official Redis alternative; no production/provider change.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout exact PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      # Fallback is only for GitHub release download errors. Never skip tests.
      - name: Fallback to official pinned Bun from npm
        if: steps.setup_bun.outcome == 'failure'
        run: npm install -g --no-audit --no-fund bun@1.4.2
      - name: Verify exact Bun runtime
        run: test "$(bun --version)" = "1.4.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Exercise MFA transactions and real migration ledger on same disposable PG16
        if: github.event_name != 'workflow_dispatch'
        working-directory: packages/api
        env:
          CI: 'true'
          PG_MFA_TEST_SENTINEL: mfa-pg16-disposable-ci-v1
          PG_MFA_TEST_URL: postgres://mfa_test:ci-disposable-only-not-a-real-secret@127.0.0.1:5432/mfa_ci_ephemeral
        run: |
          bun integration-tests/postgres/mfa-persistence.pg16.test.ts
          bun integration-tests/postgres/mfa-migrator-ledger.pg16.test.ts
          bun integration-tests/postgres/foundation-membership-transaction.pg16.test.ts
          # Focused B22 delivery-clock PG16 acceptance is independent of the
          # later, still-MANDATORY ClamAV/Chrome gates. An upstream APT mirror
          # outage must not erase the evidence for this isolated user risk.
          bun integration-tests/postgres/b22-platform-closing-email.pg16.test.ts
      - name: Existing Chrome task CA support for B22 scoped browser acceptance
        if: github.event_name != 'workflow_dispatch'
        run: |
          if ! command -v certutil >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y libnss3-tools
          fi
          command -v openssl
          command -v certutil
          command -v google-chrome
      - name: B22 free ClamAV signature database and isolated renderer — task-only PR
        if: github.event_name != 'workflow_dispatch'
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          # These packages are free and confined to this disposable CI runner.
          # A blocked signature download or unavailable sandbox MUST fail;
          # never downgrade the document review to header/magic-byte checks.
          # Two real PR runs stalled resolving the GitHub runner's Azure mirror.
          # Prefer the official Ubuntu archive on this throwaway runner only;
          # keep genuine distro package signatures, FreshClam and sandbox gates.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i \
              -e 's#http://azure.archive.ubuntu.com/ubuntu/#https://archive.ubuntu.com/ubuntu/#g' \
              -e 's#https://azure.archive.ubuntu.com/ubuntu/#https://archive.ubuntu.com/ubuntu/#g' \
              /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=1 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 install -y -qq --no-install-recommends \
            clamav-daemon clamav-freshclam bubblewrap poppler-utils imagemagick \
            apparmor-profiles apparmor-utils acl
          # Ubuntu 24.04 blocks unprivileged bwrap namespaces by default.
          # Load ONLY its distribution-supplied restrictive bwrap profile in
          # this throwaway CI VM. Never disable global AppArmor or userns rules.
          test -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = "1"
          sudo systemctl stop clamav-freshclam.service >/dev/null 2>&1 || true
          # This CI task starts its own private clamd AFTER the official
          # signatures are installed. Suppress only FreshClam's notification
          # to the unrelated distro daemon, not database verification.
          # FreshClam switches to the restricted clamav account; its
          # configuration must stay readable after privilege drop. This
          # modifies only this disposable CI runner, never a host install.
          sudo sed -i '/^NotifyClamd[[:space:]]/d' /etc/clamav/freshclam.conf
          sudo freshclam --config-file=/etc/clamav/freshclam.conf --stdout
          test -s /var/lib/clamav/daily.cvd || test -s /var/lib/clamav/daily.cld
          test -s /var/lib/clamav/main.cvd || test -s /var/lib/clamav/main.cld
          echo "PASS B22: genuine updated ClamAV database installed"

          # Probe unprivileged namespaces. Never change host sysctl, AppArmor,
          # service privileges or Docker access to force a test to pass.
          /usr/bin/bwrap --unshare-all --new-session --ro-bind /usr /usr \
            --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 \
            --proc /proc --dev /dev --tmpfs /tmp -- /usr/bin/true
          echo "PASS B22: Ubuntu restricted Bubblewrap namespace with no network"

          # The Ubuntu package already provides an AppArmor-confined daemon
          # and its local Unix socket. Do not invent a second daemon/socket:
          # /usr/sbin/clamd is forbidden from binding under RUNNER_TEMP.
          conf=/etc/clamav/clamd.conf
          test -r "$conf"
          sock=$(awk '$1=="LocalSocket" {print $2}' "$conf" | head -n1)
          case "$sock" in
            /run/clamav/clamd.ctl|/var/run/clamav/clamd.ctl) ;;
            *) echo "REFUSED: unexpected ClamAV socket"; exit 1;;
          esac
          if grep -Eq '^[[:space:]]*TCPSocket[[:space:]]+[0-9]+' "$conf"; then
            echo "REFUSED: ClamAV must have no TCP listener"
            exit 1
          fi
          sudo systemctl restart clamav-daemon.socket clamav-daemon.service
          for attempt in {1..100}; do
            if [ -S "$sock" ] && sudo systemctl is-active --quiet clamav-daemon.service; then break; fi
            sleep 1
          done
          if [ ! -S "$sock" ] || ! sudo systemctl is-active --quiet clamav-daemon.service; then
            echo "B22 official AppArmor-confined daemon unavailable"
            sudo systemctl status clamav-daemon.service --no-pager --lines=18 || true
            exit 1
          fi
          # Grant ONLY this ephemeral CI process-user socket access. Keep the
          # distro's restrictive AppArmor profile, socket mode and TCP denial.
          sudo setfacl -m "u:$(id -un):rw" "$sock"
          test -r "$sock"
          echo "PASS B22: official local-only ClamAV daemon and scoped socket ACL"
          # This uses only safe, in-memory synthetic fixtures. It isolates
          # scanner protocol, live EICAR detection and sandboxed PNG rendering
          # before the longer real Chrome acceptance. No real document paths.
          DOGRUADRES_CLAMD_SOCKET="$sock" bun -e '
            import { verifyTaxCertificateWithClamd, TaxCertificateScannerUnavailable } from "./packages/api/src/modules/dogruadres-access/tax-certificate-scanner.ts";
            import { makeSafeTaxCertificatePreview } from "./packages/api/src/modules/dogruadres-access/tax-certificate-safe-preview.ts";
            const png=Buffer.from("iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFklEQVR4nGP8//8/AwMDEwMDAwMDAwAkBgMB/DXemwAAAABJRU5ErkJggg==","base64");
            await verifyTaxCertificateWithClamd(png);
            console.log("PASS B22: real ClamAV clean PNG stream accepted");
            const eicar=Buffer.from(String.raw`X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*`);
            let denied=false;
            try { await verifyTaxCertificateWithClamd(eicar); }
            catch(error) { denied=error instanceof TaxCertificateScannerUnavailable; }
            if(!denied) throw Error("Official ClamAV EICAR detection failed");
            console.log("PASS B22: real ClamAV harmless EICAR test file denied");
            const raster=await makeSafeTaxCertificatePreview(png,"image/png");
            if(raster.length<64 || !raster.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])))
              throw Error("Sandbox did not produce a valid synthetic PNG");
            console.log("PASS B22: real isolated scanner-to-raster preview");
            const twoPagePdf=Buffer.from("","base64");
            const allPages=await makeSafeTaxCertificatePreview(twoPagePdf,"application/pdf");
            if(allPages.subarray(0,8).compare(Buffer.from([137,80,78,71,13,10,26,10]))!==0 ||
               allPages.readUInt32BE(20)<1700)
              throw Error("Two-page PDF was not completely rendered in isolation");
            console.log("PASS B22: real isolated PDF all-page preview");
            let malformedRejected=false;
            try { await makeSafeTaxCertificatePreview(Buffer.from("%PDF-1.7\\n%%EOF","ascii"),"application/pdf"); }
            catch { malformedRejected=true; }
            if(!malformedRejected)throw Error("Malformed PDF was incorrectly reviewable");
            console.log("PASS B22: malformed PDF preview fails closed");
