name: Identity Organization Foundation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    name: Foundation static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record source provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          echo "PR head: $PR_HEAD_SHA"
          echo "Merge ref: $MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Focused security and authorization unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: bun test src/modules/dogruadres-access/__tests__/security.unit.spec.ts src/utils/__tests__/organization-authorization.unit.spec.ts src/scripts/__tests__/task-mfa-bootstrap.unit.spec.ts src/scripts/__tests__/reviewer-execution-grant.unit.spec.ts src/scripts/__tests__/native-fixture-runtime.unit.spec.ts src/scripts/__tests__/r1-readiness.unit.spec.ts src/scripts/__tests__/r1-readback.unit.spec.ts src/scripts/__tests__/r1-activation.unit.spec.ts
      - name: Production HTTP secret guard regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: bun test src/utils/__tests__/production-secrets.unit.test.ts
      - name: Inactive session policy and DTO unit contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: bun test src/modules/dogruadres-access/__tests__/session-policy.unit.spec.ts src/api/dogruadres/__tests__/session-policy-contract.unit.spec.ts
      - name: API TypeScript check
        # Runtime/PostgreSQL/browser evidence is collected separately; this is unit-only.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: node ../../node_modules/typescript/bin/tsc --noEmit --incremental false -p tsconfig.json
      - name: Personal session, Organization selection and ingress unit contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        env:
          TEST_TYPE: unit
        run: bun run jest --runInBand --forceExit --runTestsByPath src/modules/dogruadres-access/__tests__/identity-session.unit.spec.ts src/modules/dogruadres-access/__tests__/memberships-service.unit.spec.ts src/modules/dogruadres-access/__tests__/actor-delegation.unit.spec.ts src/modules/dogruadres-access/__tests__/account-linking.unit.spec.ts src/utils/__tests__/ingress-config.unit.spec.ts src/api/personal/__tests__/ingress.unit.spec.ts src/api/personal/__tests__/organization-selection.unit.spec.ts src/api/personal/__tests__/workspace-lifetime.unit.spec.ts src/api/personal/__tests__/memberships.unit.spec.ts src/api/personal/__tests__/invitations.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-policy.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-login-decision.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-persistence.unit.spec.ts src/modules/dogruadres-access/__tests__/audit-persistence.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-settings-service.unit.spec.ts src/modules/dogruadres-access/__tests__/native-mfa-summary.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-enrollment-ticket.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-session-scope.unit.spec.ts src/api/personal/__tests__/mfa-settings.unit.spec.ts src/api/personal/__tests__/mfa-management.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-management.unit.spec.ts src/api/personal/__tests__/mfa-shell.unit.spec.ts src/api/personal/__tests__/mfa-enrollment.unit.spec.ts src/api/personal/__tests__/mfa-login-runtime.unit.spec.ts src/api/personal/__tests__/mfa-challenge-recovery.unit.spec.ts
      - name: Closed public front door unit contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: node --test integration-tests/session-vertical/frontdoor.unit.test.mjs
      - name: Native HTTP test syntax only
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: node --check integration-tests/http/dogruadres-foundation.native.test.mjs

  build:
    name: API backend build — test configuration
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record source provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          echo "PR head: $PR_HEAD_SHA"
          echo "Merge ref: $MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build API backend under test configuration
        working-directory: packages/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://ci@127.0.0.1:1/dogruadres_ci_build_sentinel
          REDIS_URL: redis://127.0.0.1:1
          STORE_CORS: http://127.0.0.1:19040
          ADMIN_CORS: http://127.0.0.1:19040
          VENDOR_CORS: http://127.0.0.1:19040
          AUTH_CORS: http://127.0.0.1:19040
        run: |
          # Build only: no API, migrations, services or production dashboard claim.
          export JWT_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          export COOKIE_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          export DOGRUADRES_INVITATION_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          bun run build
      - name: Production Medusa CLI rejects scaffold JWT and cookie secrets (no database)
        working-directory: packages/api
        timeout-minutes: 4
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://ci@127.0.0.1:1/safe0a_build_sentinel
          REDIS_URL: redis://127.0.0.1:1
          STORE_CORS: http://127.0.0.1:19040
          ADMIN_CORS: http://127.0.0.1:19040
          VENDOR_CORS: http://127.0.0.1:19040
          AUTH_CORS: http://127.0.0.1:19040
        shell: bash
        run: |
          set +e
          output=$(JWT_SECRET=supersecret COOKIE_SECRET=supersecret timeout 120s bunx medusa build 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "UNSAFE: Medusa production build accepted scaffold auth secrets"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -q 'Production requires distinct'; then
            echo "FAIL: Medusa CLI did not reject secrets through the expected validator"
            exit 1
          fi
          echo "PASS: production Medusa CLI rejected scaffold secrets before server startup"
      - name: Production Medusa build accepts unique synthetic secrets (no database)
        working-directory: packages/api
        timeout-minutes: 10
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://ci@127.0.0.1:1/safe0a_build_sentinel
          REDIS_URL: redis://127.0.0.1:1
          STORE_CORS: http://127.0.0.1:19040
          ADMIN_CORS: http://127.0.0.1:19040
          VENDOR_CORS: http://127.0.0.1:19040
          AUTH_CORS: http://127.0.0.1:19040
          FILE_BACKEND_URL: http://127.0.0.1:19040/static
        shell: bash
        run: |
          export JWT_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          export COOKIE_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          export DOGRUADRES_INVITATION_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          # Compile only: never launch a server, create a database, migrate or deploy.
          timeout 420s bunx medusa build

  mfa-postgres16:
    name: MFA migration and transaction — isolated PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: mfa_test
          POSTGRES_PASSWORD: ci-disposable-only-not-a-real-secret
          POSTGRES_DB: mfa_ci_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mfa_test -d mfa_ci_ephemeral"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout exact PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Exercise MFA transactions and real migration ledger on same disposable PG16
        working-directory: packages/api
        env:
          CI: 'true'
          PG_MFA_TEST_SENTINEL: mfa-pg16-disposable-ci-v1
          PG_MFA_TEST_URL: postgres://mfa_test:ci-disposable-only-not-a-real-secret@127.0.0.1:5432/mfa_ci_ephemeral
        run: |
          bun integration-tests/postgres/mfa-persistence.pg16.test.ts
          bun integration-tests/postgres/mfa-migrator-ledger.pg16.test.ts
          bun integration-tests/postgres/foundation-membership-transaction.pg16.test.ts
      - name: Full Medusa CLI module migration on disposable PG16
        working-directory: packages/api
        timeout-minutes: 5
        env:
          CI: 'true'
          PG_MFA_TEST_SENTINEL: mfa-pg16-disposable-ci-v1
          PG_MFA_TEST_URL: postgres://mfa_test:ci-disposable-only-not-a-real-secret@127.0.0.1:5432/mfa_ci_ephemeral
        run: bun integration-tests/postgres/foundation-medusa-cli.pg16.test.ts
      - name: Foundation native Medusa module / ORM transaction on disposable PG16
        working-directory: packages/api
        env:
          CI: 'true'
          PG_MFA_TEST_SENTINEL: mfa-pg16-disposable-ci-v1
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USERNAME: mfa_test
          DB_PASSWORD: ci-disposable-only-not-a-real-secret
          TEST_TYPE: integration:modules
        run: bun run test:integration:modules --runTestsByPath src/modules/dogruadres-access/__tests__/foundation-native.integration.spec.ts
      # The test erases its own schema in finally. GitHub Actions terminates and
      # removes this ephemeral PostgreSQL service on job exit/cancel. There is
      # no repository volume, persistent fixture or access to the M0 task DB.
