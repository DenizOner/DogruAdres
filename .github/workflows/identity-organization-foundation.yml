name: Identity Organization Foundation

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Authorized isolated acceptance scope
        required: true
        type: choice
        options: [b02, b04, b04-ui, b05-ui, b06-ui, b07-ui, b08-ui]
  pull_request:
    branches: [main]
    # Draft changes use targeted local checks; complete CI starts when ready.
    # Subsequent commits to ready PRs must run all required checks again.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The repository already uses GitHub's default CodeQL setup, which
  # rejects separate advanced-setup SARIF uploads. Analyze the actual JS/TS
  # sources locally (without changing repository security settings), check
  # SARIF and retain precise findings in this job's real CI log.
  codeql-javascript-typescript:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    name: CodeQL — JavaScript/TypeScript (local SARIF)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize JavaScript and TypeScript CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4, 2026-11-04
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze JavaScript and TypeScript without conflicting SARIF upload
        id: js_ts_scan
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4, 2026-11-04
        with:
          category: /language:javascript-typescript
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/dogruadres-codeql-js-ts
      - name: Read actual CodeQL JavaScript/TypeScript SARIF results
        shell: bash
        env:
          CODEQL_SARIF_DIR: ${{ steps.js_ts_scan.outputs.sarif-output }}
        run: |
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path')
          const dir=process.env.CODEQL_SARIF_DIR
          if(!dir||!fs.existsSync(dir))throw Error('CodeQL JS/TS results directory missing')
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>
            e.isDirectory()?walk(path.join(d,e.name)):
              e.isFile()&&e.name.endsWith('.sarif')?[path.join(d,e.name)]:[])
          const files=walk(dir)
          if(files.length!==1)throw Error('Expected exactly one CodeQL JS/TS SARIF file')
          const sarif=JSON.parse(fs.readFileSync(files[0],'utf8'))
          if(!Array.isArray(sarif.runs)||sarif.runs.length!==1)
            throw Error('Invalid CodeQL analysis run')
          const run=sarif.runs[0]
          if(!/codeql/i.test(String(run.tool?.driver?.name??'')))
            throw Error('Unexpected SARIF analyzer')
          const results=run.results??[]
          if(!Array.isArray(results))throw Error('Invalid CodeQL findings')
          const counts={error:0,warning:0,note:0,other:0}
          for(const r of results){
            const level=r.level??'warning'
            counts[level in counts?level:'other']++
          }
          console.log('CodeQL JS/TS local SARIF analysis completed: '+JSON.stringify(counts))
          for(const r of results.slice(0,40)){
            const location=r.locations?.[0]?.physicalLocation
            const file=String(location?.artifactLocation?.uri??'unknown')
            const line=location?.region?.startLine??0
            console.log('CodeQL finding '+String(r.level??'warning')+' '+String(r.ruleId??'unknown')+' '+file+':'+line)
          }
          if(counts.error>0||counts.warning>0)throw Error('CodeQL JS/TS error/warning findings require review')
          JS

  r1-windows-authz:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    name: R1 Windows native Authz — synthetic token/ACL only
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - name: Checkout exact PR merge ref without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and execute native Windows Authz against in-memory descriptors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Path 'packages/api/src/scripts/r1-authz.cs'
          $me = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $allow = [System.Security.AccessControl.FileSecurity]::new()
          $allow.SetOwner($me.User)
          $allow.SetAccessRuleProtection($true, $false)
          $allow.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new($me.User, [System.Security.AccessControl.FileSystemRights]::ReadData, [System.Security.AccessControl.AccessControlType]::Allow))
          $sd = $allow.GetSecurityDescriptorBinaryForm()
          $mask = [R1AclProbe]::Check($sd, '')
          if (($mask -band 1) -ne 1) { throw 'FAIL: native current-token read not granted' }
          $deny = [System.Security.AccessControl.FileSecurity]::new()
          $deny.SetOwner($me.User)
          $deny.SetAccessRuleProtection($true, $false)
          $deny.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new($me.User, [System.Security.AccessControl.FileSystemRights]::ReadData, [System.Security.AccessControl.AccessControlType]::Deny))
          $denied = [R1AclProbe]::Check($deny.GetSecurityDescriptorBinaryForm(), '')
          if (($denied -band 1) -ne 0) { throw 'FAIL: native denied read granted' }
          # PowerShell may wrap a native C# exception in multiple layers.
          function Assert-ExpectedRefusal([System.Exception]$errorValue, [string]$label) {
            $cursor = $errorValue
            while ($null -ne $cursor) {
              if ($cursor.Message -like 'BLOCKED:*' -or $cursor.Message -like 'REFUSED:*') { return }
              $cursor = $cursor.InnerException
            }
            throw "FAIL: unexpected exception for $label"
          }
          try {
            [void][R1AclProbe]::Check($sd, $me.User.Value)
            throw 'FAIL: uncommissioned SID route accepted'
          } catch {
            Assert-ExpectedRefusal $_.Exception 'uncommissioned SID'
          }
          $method = [R1AclProbe].GetMethod('CheckVerifiedReaderProcess', [System.Reflection.BindingFlags]::Static -bor [System.Reflection.BindingFlags]::NonPublic)
          if ($null -eq $method) { throw 'FAIL: actual-token process probe missing' }
          $proc = [System.Diagnostics.Process]::GetCurrentProcess()
          $args = [object[]]::new(5)
          $args[0] = $sd
          $args[1] = [int]$proc.Id
          $args[2] = [string]$proc.StartTime.ToUniversalTime().ToFileTimeUtc()
          $args[3] = [string]$me.User.Value
          $args[4] = [string]$proc.MainModule.FileName
          $actual = [uint32]$method.Invoke($null, $args)
          if (($actual -band 1) -ne 1) { throw 'FAIL: verified real-process token denied synthetic read' }
          function Assert-Refused([object[]]$values, [string]$label) {
            try {
              [void]$method.Invoke($null, $values)
              throw "FAIL: $label accepted"
            } catch {
              Assert-ExpectedRefusal $_.Exception $label
            }
          }
          $bad = [object[]]$args.Clone()
          $bad[2] = [string](([long]$args[2]) + 1)
          Assert-Refused $bad 'wrong creation time'
          $bad = [object[]]$args.Clone()
          $bad[3] = 'S-1-0-0'
          Assert-Refused $bad 'wrong process SID'
          $bad = [object[]]$args.Clone()
          $bad[4] = [string](Join-Path $env:WINDIR 'System32\cmd.exe')
          Assert-Refused $bad 'wrong executable'
          $bad = [object[]]$args.Clone()
          $bad[1] = -1
          Assert-Refused $bad 'invalid process ID'
          Write-Output 'PASS: real Windows Authz in-memory allow/deny, private process token and rejected substitutions; protected sandbox NOT TESTED'

  static:
    # Required checks must execute even for drafts; a skipped required check can count as success.
    if: github.event_name != 'workflow_dispatch'
    name: Foundation static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record source provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          echo "PR head: $PR_HEAD_SHA"
          echo "Merge ref: $MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      # Fallback is only for GitHub release download errors. Never skip tests.
      - name: Fallback to official pinned Bun from npm
        if: steps.setup_bun.outcome == 'failure'
        run: npm install -g --no-audit --no-fund bun@1.4.2
      - name: Verify exact Bun runtime
        run: test "$(bun --version)" = "1.4.2"
      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile
      # Reuse the existing required Foundation job for the approved #159 build
      # repair and #309 Next.js security patch branches only.
      # Never skip or suppress TypeScript, ESLint or Next production failures.
      - name: Storefront #159 type, lint and production build diagnostics
        if: ${{ github.event_name == 'pull_request' && (github.head_ref == 'fix/storefront-build-eslint-types-159' || github.head_ref == 'fix/security-next-15528-309' || github.head_ref == 'fix/storefront-image-allowlist-175') && steps.install.outcome == 'success' }}
        timeout-minutes: 8
        working-directory: apps/storefront
        shell: bash
        run: |
          set -euo pipefail
          # CI-only page is built and served on an isolated runner, never committed
          # or deployed. It tests actual SafeImage hydration/error fallback.
          if [ "$GITHUB_HEAD_REF" = "fix/storefront-image-allowlist-175" ]; then
            mkdir -p src/app/images/image-175-ci-only
            cat > src/app/images/image-175-ci-only/page.tsx <<'TSX'
          'use client'
          import Image from '@/components/molecules/SafeImage/SafeImage'
          export default function Image175TestPage() {
            return (
              <main>
                <Image
                  data-testid="image175-remote"
                  src="https://untrusted.example.test/no-image.png"
                  alt="Blocked source"
                  width={96}
                  height={96}
                  priority
                />
              </main>
            )
          }
          TSX
            trap 'rm -rf src/app/images/image-175-ci-only' EXIT
          fi
          # Use the existing official Mercur CLI route codegen, never a
          # synthetic hand-written route map or unconditional unsafe cast.
          (cd ../../packages/api && bun run codegen)
          test -s ../../packages/api/.mercur/routes.d.ts
          set +e
          node ../../node_modules/typescript/bin/tsc --noEmit --incremental false -p tsconfig.json > "$RUNNER_TEMP/storefront-159-types.log" 2>&1
          type_status=$?
          bun run lint > "$RUNNER_TEMP/storefront-159-lint.log" 2>&1
          lint_status=$?
          bun run build > "$RUNNER_TEMP/storefront-159-build.log" 2>&1
          build_status=$?
          set -e
          echo "Storefront #159 type exit=$type_status"
          echo "Storefront #159 TS diagnostics: $(grep -cE 'error TS[0-9]+' "$RUNNER_TEMP/storefront-159-types.log" || true)"
          awk '/error TS[0-9]+/ && ++n<=180 { print }' "$RUNNER_TEMP/storefront-159-types.log"
          echo "Storefront #159 lint exit=$lint_status"
          awk '/  error  / {e++} /  warning  / {w++} END {printf "Storefront #159 complete lint totals: errors=%d warnings=%d\\n", e, w}' "$RUNNER_TEMP/storefront-159-lint.log"
          sed -n '1,350p' "$RUNNER_TEMP/storefront-159-lint.log"
          echo "Storefront #159 production build exit=$build_status"
          sed -n '1,110p' "$RUNNER_TEMP/storefront-159-build.log"
          # Negative probe: a broken TypeScript export must be rejected.
          probe="src/__storefront_159_bad_syntax_probe__.ts"
          trap 'rm -f "$probe"' EXIT
          printf 'export const = ;\n' > "$probe"
          if node ../../node_modules/eslint/bin/eslint.js "$probe" > "$RUNNER_TEMP/storefront-159-negative.log" 2>&1; then
            echo "FAIL: ESLint accepted invalid TypeScript syntax"
            exit 1
          fi
          grep -Eiq 'parsing error|unexpected token|unexpected character' "$RUNNER_TEMP/storefront-159-negative.log" || {
            echo "FAIL: ESLint did not report a syntax diagnostic for the negative probe"
            sed -n '1,30p' "$RUNNER_TEMP/storefront-159-negative.log"
            exit 1
          }
          echo "PASS: ESLint rejects deliberately invalid TypeScript syntax"
          # #159: focused native-price DTO and invalid-value regressions, using existing Bun.
          bun test src/lib/helpers/get-product-price.test.ts
          test "$type_status" -eq 0 && test "$lint_status" -eq 0 && test "$build_status" -eq 0
          if [ "$GITHUB_HEAD_REF" = "fix/storefront-image-allowlist-175" ]; then
            bun test next.config.image.test.ts
            node scripts/verify-image-optimizer.mjs
          fi
      - name: Native SMTP HTTPS privacy negative regressions
        id: asvs_smtp_http
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: |
          node --test integration-tests/postgres/smtp-response-privacy-guard.test.mjs
          bun test integration-tests/postgres/smtp-response-privacy-guard.test.mjs
      - name: Focused security and authorization unit tests
        id: asvs_authz_unit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: bun test src/modules/dogruadres-access/__tests__/security.unit.spec.ts src/utils/__tests__/organization-authorization.unit.spec.ts src/scripts/__tests__/task-mfa-bootstrap.unit.spec.ts src/scripts/__tests__/reviewer-execution-grant.unit.spec.ts src/scripts/__tests__/native-fixture-runtime.unit.spec.ts src/scripts/__tests__/r1-readiness.unit.spec.ts src/scripts/__tests__/r1-readback.unit.spec.ts src/scripts/__tests__/r1-activation.unit.spec.ts
      - name: Production HTTP secret guard regressions
        id: asvs_secrets_unit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: bun test src/utils/__tests__/production-secrets.unit.test.ts
      - name: Inactive session policy and DTO unit contracts
        id: asvs_session_unit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: bun test src/modules/dogruadres-access/__tests__/session-policy.unit.spec.ts src/api/dogruadres/__tests__/session-policy-contract.unit.spec.ts
      - name: API TypeScript check
        # Runtime/PostgreSQL/browser evidence is collected separately; this is unit-only.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        # Keep every TypeScript diagnostic active. This project-wide Medusa
        # typecheck exceeds Node's default V8 call stack (RangeError) on
        # current B22 source; provide bounded stack headroom, not --skipCheck.
        run: node --stack-size=4096 ../../node_modules/typescript/bin/tsc --noEmit --incremental false -p tsconfig.json
      - name: Admin dashboard TypeScript and Vite build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/admin
        run: |
          bun run build
          test -s dist/index.html
          grep -Fq '/dashboard/assets/' dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -print -quit)"
      - name: Token privacy and native SMTP notification regressions
        id: asvs_token_privacy_unit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        env:
          TEST_TYPE: unit
        run: bun run jest --runInBand --runTestsByPath src/subscribers/__tests__/auth-verification-requested.unit.spec.ts src/modules/notification-smtp/__tests__/notification-smtp.unit.spec.ts src/modules/notification-smtp/__tests__/notification-transport.unit.spec.ts src/modules/notification-smtp/__tests__/verification-origin.unit.spec.ts src/api/personal/__tests__/token-privacy.unit.spec.ts src/api/auth/__tests__/verify-email.unit.spec.ts
      - name: Personal session, Organization selection and ingress unit contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        env:
          TEST_TYPE: unit
        run: bun run jest --runInBand --forceExit --runTestsByPath src/modules/dogruadres-access/__tests__/identity-session.unit.spec.ts src/modules/dogruadres-access/__tests__/person-mobile.unit.spec.ts src/modules/dogruadres-access/__tests__/person-registration.unit.spec.ts src/modules/dogruadres-access/__tests__/legal-store-ownership.unit.spec.ts src/modules/dogruadres-access/__tests__/memberships-service.unit.spec.ts src/modules/dogruadres-access/__tests__/invitation-resend-service.unit.spec.ts src/modules/dogruadres-access/__tests__/actor-delegation.unit.spec.ts src/modules/dogruadres-access/__tests__/account-linking.unit.spec.ts src/utils/__tests__/ingress-config.unit.spec.ts src/api/personal/__tests__/ingress.unit.spec.ts src/api/personal/__tests__/profile.unit.spec.ts src/api/personal/__tests__/register.unit.spec.ts src/api/personal/__tests__/organization-applications.unit.spec.ts src/modules/dogruadres-access/__tests__/tax-certificate-policy.unit.spec.ts src/modules/dogruadres-access/__tests__/tax-certificate-scanner.unit.spec.ts src/api/personal/__tests__/organization-selection.unit.spec.ts src/api/personal/__tests__/organization-stores.unit.spec.ts src/api/personal/__tests__/store-owner-pause.unit.spec.ts src/api/personal/__tests__/store-owner-closing.unit.spec.ts src/api/personal/__tests__/store-approvals.unit.spec.ts src/api/personal/__tests__/store-product-permissions.unit.spec.ts src/api/personal/__tests__/store-member-connections.unit.spec.ts src/api/personal/__tests__/buyer-permissions.unit.spec.ts src/api/personal/__tests__/buyer-context.unit.spec.ts src/api/personal/__tests__/catalog.unit.spec.ts src/api/personal/__tests__/native-try-list-price.unit.spec.ts src/api/personal/__tests__/native-group-try-reference.unit.spec.ts src/api/personal/__tests__/store-price-groups.unit.spec.ts src/api/personal/__tests__/product-drafts.unit.spec.ts src/api/personal/__tests__/launcher-b22.unit.spec.ts src/api/personal/__tests__/workspace-lifetime.unit.spec.ts src/api/personal/__tests__/notifications.unit.spec.ts src/api/personal/__tests__/memberships.unit.spec.ts src/api/personal/__tests__/invitations.unit.spec.ts src/api/dogruadres/__tests__/audit-timeline.unit.spec.ts src/api/personal/__tests__/audit-timeline.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-policy.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-login-decision.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-persistence.unit.spec.ts src/modules/dogruadres-access/__tests__/audit-persistence.unit.spec.ts src/modules/dogruadres-audit-index/__tests__/envelope.unit.spec.ts src/workflows/dogruadres-audit-relay/__tests__/relay.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-settings-service.unit.spec.ts src/modules/dogruadres-access/__tests__/native-mfa-summary.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-enrollment-ticket.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-session-scope.unit.spec.ts src/api/personal/__tests__/mfa-settings.unit.spec.ts src/api/personal/__tests__/mfa-management.unit.spec.ts src/modules/dogruadres-access/__tests__/mfa-management.unit.spec.ts src/api/personal/__tests__/mfa-shell.unit.spec.ts src/api/personal/__tests__/mfa-enrollment.unit.spec.ts src/api/personal/__tests__/mfa-login-runtime.unit.spec.ts src/api/personal/__tests__/mfa-challenge-recovery.unit.spec.ts src/modules/dogruadres-access/__tests__/provision-personal-organization.unit.spec.ts src/api/personal/__tests__/platform.unit.spec.ts src/modules/dogruadres-access/__tests__/smtp-client.unit.spec.ts src/api/personal/__tests__/platform-smtp.unit.spec.ts src/modules/dogruadres-access/__tests__/smtp-settings.unit.spec.ts src/modules/dogruadres-access/__tests__/smtp-crypto.unit.spec.ts src/api/personal/__tests__/store-applications.unit.spec.ts src/api/personal/__tests__/store-rename-requests.unit.spec.ts src/api/personal/__tests__/platform-store-renames.unit.spec.ts
      - name: Closed public front door unit contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: node --test integration-tests/session-vertical/frontdoor.unit.test.mjs
      - name: Native HTTP test syntax only
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/api
        run: node --check integration-tests/http/dogruadres-foundation.native.test.mjs

      # Reuse executed suites. The summary identifies evidence candidates, NOT full ASVS compliance.
      # An unsuccessful/skipped step remains visible; this step never overrides a failed job.
      - name: Publish ASVS 5.0 existing-test evidence index (no extra scans)
        if: ${{ !cancelled() }}
        env:
          ASVS_SMTP_HTTP: ${{ steps.asvs_smtp_http.outcome }}
          ASVS_AUTHZ_UNIT: ${{ steps.asvs_authz_unit.outcome }}
          ASVS_SECRETS_UNIT: ${{ steps.asvs_secrets_unit.outcome }}
          ASVS_SESSION_UNIT: ${{ steps.asvs_session_unit.outcome }}
          ASVS_TOKEN_PRIVACY_UNIT: ${{ steps.asvs_token_privacy_unit.outcome }}
        run: |
          {
            echo '### OWASP ASVS 5.0 — existing test evidence (partial, not compliance)'
            echo '| Related ASVS area | Existing test step | Actual step outcome | Evidence limit |'
            echo '|---|---|---|---|'
            echo "| V8.2 / V8.3 | Focused security and authorization unit tests | ${ASVS_AUTHZ_UNIT} | Unit authorization contracts; not full tenant HTTP proof |"
            echo "| V7 | Inactive session policy and DTO unit contracts | ${ASVS_SESSION_UNIT} | Domain/DTO contracts; not full session termination E2E |"
            echo "| V13 | Production HTTP secret guard regressions | ${ASVS_SECRETS_UNIT} | Rejects weak secrets; does not establish secrets vault controls |"
            echo "| V14 / V16 | Native SMTP HTTPS privacy negative regressions | ${ASVS_SMTP_HTTP} | Synthetic HTTP negative tests; not production egress verification |"
            echo "| V14 | Token privacy and native SMTP notification regressions | ${ASVS_TOKEN_PRIVACY_UNIT} | Unit privacy contracts; not all sensitive-data flows |"
            echo ''
            echo 'Other pre-existing checks: CodeQL JS/TS (separate ready PR job), isolated PostgreSQL 16/Chrome (separate ready PR job), Governance Chromium (separate ready workflow). Inspect their actual runs; this summary does not infer their outcomes.'
            echo ''
            echo 'Step success is evidence that the named tests ran, **not** PASS for every ASVS requirement in that area. Uncovered, partial, and NOT TESTED requirements remain for risk-based manual review under AGENTS.md and the ASVS auditor skill.'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    # Required checks must execute even for drafts; a skipped required check can count as success.
    if: github.event_name != 'workflow_dispatch'
    name: API backend build — test configuration
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record source provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          echo "PR head: $PR_HEAD_SHA"
          echo "Merge ref: $MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
