name: TEMP Next.js 15.5.27 lockfile generation (scoped)
on:
  push:
    branches:
      - fix/next-15-5-27-lockfile-20261020
permissions:
  contents: write
concurrency:
  group: next-lockfile-20261020
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/fix/next-15-5-27-lockfile-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Generate lockfile with official Bun, no scripts
        shell: bash
        run: |
          set -euo pipefail
          node -e "const x=require('./apps/storefront/package.json');if(x.dependencies.next!=='15.5.27') process.exit(1)"
          bun install --lockfile-only --ignore-scripts
          changed="$(git diff --name-only)"
          if [ "$changed" != 'bun.lock' ]; then
            echo "Unexpected changed tracked files; refuse auto-commit"
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --stat -- bun.lock
          bun install --frozen-lockfile --ignore-scripts
      - name: Commit generated lockfile only, using non-force push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/next-15-5-27-lockfile-20261020'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bun.lock
          git commit -m 'fix(deps): lock Next.js 15.5.27 with Bun 1.4.2'
          git push origin HEAD:refs/heads/fix/next-15-5-27-lockfile-20261020
